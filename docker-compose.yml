services:
  postgres:
    image: postgres:16
    container_name: fgames-postgres
    environment:
      POSTGRES_DB: fgames
      POSTGRES_USER: fgames
      POSTGRES_PASSWORD: fgames_dev_only
    ports:
      - "5432:5432"
    volumes:
      - fgames-postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fgames-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fgames.com
      PGADMIN_DEFAULT_PASSWORD: fgames_dev_only
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - fgames-pgadmin-data:/var/lib/pgadmin

volumes:
  fgames-postgres-data:
  fgames-pgadmin-data:

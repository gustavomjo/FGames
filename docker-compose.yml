services:
  postgres:
    image: postgres:16
    container_name: fgames-postgres
    environment:
      POSTGRES_DB: fgames
      POSTGRES_USER: fgames
      POSTGRES_PASSWORD: fgames_dev_only
    ports:
      - "5432:5432"
    volumes:
      - fgames-postgres-data:/var/lib/postgresql/data

volumes:
  fgames-postgres-data:
